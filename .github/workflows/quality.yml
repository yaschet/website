name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_ENVIRONMENT: test
  # Build-only fixture. Tests must not submit a deliverable contact message.
  RESEND_API_KEY: re_ci_placeholder_never_delivered

jobs:
  title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: node scripts/check-commit-message.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
  checks:
    name: Source and dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - run: pnpm verify
      - run: pnpm audit:dependencies
      - run: pnpm test:unit
  browser:
    name: Browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            engine: chromium
          - project: mobile-chrome
            engine: chromium
          - project: mobile-safari
            engine: webkit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - run: pnpm build
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-failure-${{ matrix.project }}
          path: test-results/
          retention-days: 7
  storybook:
    name: Storybook (light and dark)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build-storybook
      - run: pnpm test:storybook
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: storybook-failure
          path: test-results/
          retention-days: 7
  quality:
    if: ${{ always() }}
    needs: [checks, browser, storybook]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality job to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          STORYBOOK_RESULT: ${{ needs.storybook.result }}
        run: |
          if [ "$CHECKS_RESULT" != success ] || [ "$BROWSER_RESULT" != success ] || [ "$STORYBOOK_RESULT" != success ]; then
            echo "Quality failed: checks=$CHECKS_RESULT browser=$BROWSER_RESULT storybook=$STORYBOOK_RESULT"
            exit 1
          fi
